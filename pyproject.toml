[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-programmer-studio"
version = "0.1.0"
description = "Capability-gated Teensy 4.1 programming workstation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
packages = ["app", "core", "transport", "devices", "file_formats", "memory", "programmers", "analyzer", "storage", "ui"]
